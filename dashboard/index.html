<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saitama AI Status</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #09090b; color: #f4f4f5; font: 16px system-ui, sans-serif; display: grid; place-items: center; }
    main { width: min(720px, 90vw); border: 1px solid #27272a; border-radius: 18px; padding: 32px; background: #111113; box-shadow: 0 20px 80px #0008; }
    h1 { margin-top: 0; letter-spacing: .08em; } .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { padding: 18px; border: 1px solid #27272a; border-radius: 12px; background: #18181b; } .label { color: #a1a1aa; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; } .value { margin-top: 8px; font-size: 24px; font-weight: 700; }
  </style>
</head>
<body><main><h1>SAITAMA AI</h1><p>Command bot status dashboard. Game features are disabled.</p><div class="grid"><div class="card"><div class="label">Status</div><div class="value" id="bot">—</div></div><div class="card"><div class="label">AI</div><div class="value" id="ai">—</div></div><div class="card"><div class="label">Commands</div><div class="value" id="commands">—</div></div></div></main><script>fetch('/api/status').then(r=>r.json()).then(s=>{document.getElementById('bot').textContent=s.bot+' · '+s.uptime+'s';document.getElementById('ai').textContent=s.ai;document.getElementById('commands').textContent=s.commands}).catch(()=>{document.getElementById('bot').textContent='offline'})</script></body>
</html>
